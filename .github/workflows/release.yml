# Release workflow.
#
# This file is generated by `cargo-dist` (`dist init`) from
# `dist-workspace.toml`, then committed. It is a build product: a hand edit is
# lost the next time `dist init` runs. The one hand-added part is the `gate`
# job, which is why it is marked clearly below.
#
# What it does, in order:
#
#   gate                  the whole test gate, before anything is built
#   plan                  work out which builds to run for this tag
#   build-local-artifacts build six binaries and their tarballs
#   attest                sign build provenance, out of the build job's trust boundary
#   build-global-artifacts build the shell installer and the Homebrew formula
#   smoke                 run the built binaries, before anything is published
#   host                  upload the artifacts and create the release
#   publish-homebrew-formula  push the formula to bruj0/homebrew-tap
#
# The generated `announce` job is deliberately absent. `dist-workspace.toml`
# leaves `github-release` at its default, so `host` already creates the release
# with its final title and body; `dist host --steps=announce` had nothing left
# to do. It also had no checkout step, so it ran in an empty runner directory
# and failed every release with
#
#   × Failed to find Cargo.toml in an ancestor of /home/runner/work/...
#
# A job that can only fail is worse than no job: it marks a good release red.
# `dist init` will regenerate it, so delete it again if that happens.
#
# The `.deb` and `.rpm` packages are a separate workflow (`packages.yml`),
# because `cargo-dist` does not build them.
#
# A tag pushed to the UPSTREAM repository releases nothing. This workflow runs
# in the downstream repository, which is where the assets are served from.

name: Release

permissions:
  "contents": "read"

on:
  push:
    # A tag publishes. A push to `main` does not — it exists to seed the build
    # cache in the default branch's scope, which is the only scope a pull request
    # can read.
    #
    # GitHub's rule, verified against the docs and against two PR runs that both
    # missed: a cache created by a `pull_request` run is scoped to
    # `refs/pull/<n>/merge` and "cannot be restored by the base branch or other
    # pull requests targeting that base branch". So saving on PRs helps only a
    # re-run of that same PR.
    #
    # A run on `main` writes the cache where every PR can read it. The gate still
    # runs on that push — it is the same check, and skipping it would mean `main`
    # could be red while PRs were green.
    branches:
      - main
    tags:
      - "v[0-9]+.*"
  pull_request:

jobs:
  # ---------------------------------------------------------------------------
  # HAND-ADDED. Classify the diff so the gate can run the right amount of work.
  #
  # A documentation-only PR used to pay the same five minutes as a change to the
  # memory barrier. That is the wrong default: a gate that costs five minutes for
  # a typo teaches people to batch unrelated changes, and a gate people stop
  # watching is a gate that stops working.
  #
  # The classification is by **what changed**, never by a belief about what
  # cannot be affected. `scripts/ksp-gate-scope.sh` holds the rules and its own
  # selftest, and it defaults to `full` for anything it does not recognise — a
  # scope that silently widened would be worse than no split at all.
  #
  # A tag and a push to `main` are always `full`. The scope exists to make a PR
  # fast, not to make a release less checked.
  # ---------------------------------------------------------------------------
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.classify.outputs.scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The classifier diffs against the base, so it needs the history.
          fetch-depth: 0

      - name: Classify the diff
        id: classify
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # A tag publishes and `main` seeds the cache every PR reads. Neither is
          # narrowed: the scope exists to make a PR fast, not to make a release
          # less checked.
          if [ "$EVENT" != "pull_request" ] || [ "${REF#refs/tags/}" != "$REF" ]; then
            echo "scope=full" >> "$GITHUB_OUTPUT"
            echo "not a pull request, so the scope is full"
            exit 0
          fi
          if [ -z "${BASE_SHA:-}" ]; then
            # No base means the classification cannot run. A failed
            # classification must not narrow the gate.
            echo "scope=full" >> "$GITHUB_OUTPUT"
            echo "::warning::no base sha; defaulting to the full gate"
            exit 0
          fi
          scope="$(bash scripts/ksp-gate-scope.sh --base "$BASE_SHA")"
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "scope: $scope"
          git diff --name-only "${BASE_SHA}...HEAD" | head -50

  # ---------------------------------------------------------------------------
  # HAND-ADDED. Everything in this job is not `dist` output.
  #
  # A tag must not publish a binary the gate has not seen. This job runs the
  # same `ci` part of scripts/ksp-gate.sh that the operator runs locally, so the
  # release definition and the local definition cannot diverge.
  # ---------------------------------------------------------------------------
  gate:
    # ubuntu-24.04, not 22.04: the gate runs tests, it does not produce release
    # artifacts, so the glibc floor that forces 22.04 on the build jobs does not
    # apply here. 24.04 packages `valkey-server`, which
    # `ksp-backend:valkey_durability` spawns from a hardcoded
    # `/usr/bin/valkey-server` path.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    needs:
      - changes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Report the scope
        shell: bash
        env:
          SCOPE: ${{ needs.changes.outputs.scope }}
        run: |
          echo "gate scope: $SCOPE"
          case "$SCOPE" in
            docs)
              echo "documentation only: markers, fmt and workflow lint. The"
              echo "setup steps below are skipped because nothing they install"
              echo "can affect a prose change."
              ;;
            code)
              echo "product change: the full suite except the targets that need"
              echo "root or a Linux-only mechanism. Those run on main and tags."
              ;;
            *)
              echo "full: everything this runner can check."
              ;;
          esac

      - name: Install Rust
        if: needs.changes.outputs.scope != 'docs'
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
          rustup default 1.99.1

      - name: Cache cargo registry and dependency builds
        if: needs.changes.outputs.scope != 'docs'
        # Measured: the gate's 5m22s is now almost entirely compilation. The tests
        # themselves run in about 90 seconds; the rest is building 322 crates, and
        # `aws-lc-sys` alone compiles a large body of C for the TLS stack.
        #
        # `rust-cache` caches `~/.cargo` and the *dependency* artifacts in the
        # target directory. It deliberately does not cache this workspace's own
        # crates, because a workspace crate changes on almost every commit and a
        # restored artifact for it would be thrown away — so the saving is the
        # dependency graph, which is exactly the expensive part here.
        #
        # `workspaces` must name the gate's real target directory. The gate
        # defaults to `/tmp/ksp-gate-target`, not `./target`, and `rust-cache`
        # defaults to `./target` — so without this line the cache would be saved
        # and restored against a directory the build never writes to, and every
        # run would look like a cache miss while reporting a healthy cache.
        #
        # The key includes `Cargo.lock`, `rust-toolchain.toml` and any `RUST*`
        # environment variable, so a dependency bump or a toolchain change misses
        # the cache rather than restoring artifacts built from something else.
        # That matters here: the release job sets `RUSTFLAGS` for path remapping,
        # and a cache keyed without it would restore artifacts whose embedded
        # paths differ from what the release is supposed to contain.
        #
        # `save-if` saves on `main` only, and that is the whole point.
        #
        # GitHub scopes a cache to the ref that created it. A `pull_request` run
        # writes to `refs/pull/<n>/merge`, and the docs are explicit that such a
        # cache "cannot be restored by the base branch or other pull requests
        # targeting that base branch" — so a PR save helps only a re-run of that
        # same PR.
        #
        # Measured, twice:
        #
        #   PR #7  cache step 4s, gate 5m43s   (nothing to restore)
        #   PR #8  cache step 1s, gate 7m29s   (PR #7's cache invisible to it)
        #
        # A run on `main` writes to the default branch's scope, and a PR *can*
        # restore from there. That is why `on.push.branches` now includes `main`:
        # without a run on that branch there is nothing for a PR to read, which is
        # why four release runs produced `total_count: 0`.
        #
        # A tag build restores but does not save. It must not depend on a cache a
        # PR could have written, and it is the one run where a cold compile is
        # acceptable.
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # No `workspaces` override: the gate is told to build into `./target`
          # by `CARGO_TARGET_DIR` below, which is `rust-cache`'s default and the
          # only path it resolves reliably.
          #
          # The previous value was `". -> /tmp/ksp-gate-target"`, and the target
          # half of that is resolved **relative to the workspace**, so it became
          # `/home/runner/work/keyspout/keyspout/tmp/ksp-gate-target` — a
          # directory the gate never writes to. The cache restored 62MB of
          # registry on every run and not one compiled artifact, so every phase
          # cost a cold build while the log said `Cache restored successfully`.
          #
          # Verified by reading the resolved path in the cache step's own log
          # rather than trusting the syntax.
          cache-on-failure: "true"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # NO CACHE FOR THE PRIVILEGED TARGET DIRECTORY, and the reason is measured.
      #
      # WP1 of `docs/plans/gate-performance.md` proposed caching it: `principals`
      # spent 73 of its 75 seconds compiling because its target directory is
      # separate and therefore cold. The plan suggested `target-root` inside the
      # checkout with a second `rust-cache` entry.
      #
      # That was tried and it fails, on run 43761322911:
      #
      #   thread 'two_accounts_complete_the_session_and_the_kernel_keeps_them_apart'
      #   panicked at crates/ksp/tests/principals.rs:524:22:
      #   the binary runs: Os { code: 13, kind: PermissionDenied }
      #
      # The privileged run writes `target-root/` as **root**. The next non-root
      # invocation then cannot execute the binary it needs, because the directory
      # and its contents belong to root. That is the same failure the separate
      # target directory exists to prevent — moving it inside the checkout
      # reintroduces it, just one level down.
      #
      # So the directory stays outside the workspace and stays uncached. The 73
      # seconds are the price of the permission isolation, and the isolation is
      # the thing the test is about.

      - name: Install build dependencies
        if: needs.changes.outputs.scope != 'docs'
        # A timeout on this step, not only on the job.
        #
        # `apt-get update` against the Ubuntu archive has hung for 25+ minutes on
        # this runner image, and with no step timeout the job sat there until its
        # 90-minute limit. A hung step and a slow build look identical from
        # outside, and the log blob is not readable while a step is running, so
        # the only symptom was a gate that never finished.
        #
        # `Acquire::Retries` and the per-acquire timeouts turn a stalled mirror
        # into a retry or a failure rather than an indefinite wait. Ten minutes is
        # generous for an install that normally takes thirty seconds.
        timeout-minutes: 10
        run: |
          sudo apt-get update \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30
          sudo apt-get install -y --no-install-recommends \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            cmake make g++ perl pkg-config libssl-dev \
            valkey-server unzip curl

      - name: Install cargo-audit and cargo-vet
        if: needs.changes.outputs.scope != 'docs'
        # Prebuilt binaries, not `cargo install`.
        #
        # `cargo install cargo-audit --locked && cargo install cargo-vet
        # --locked` took **4m 48s** on every run, measured across two runs, and
        # it was the single largest cost in this job — larger than clippy, larger
        # than the vulnerability scan it exists to support. Both projects publish
        # a prebuilt x86_64 Linux binary, so the compile is pure waste.
        #
        # The digests are pinned here rather than fetched, which is stronger than
        # a published checksum file: the expected value lives in this repository
        # and changes only through review. `cargo-audit` publishes no checksum
        # asset at all, so a fetched one was not an option for it anyway.
        #
        # Both digests were computed from the release assets and re-verified in
        # the Linux VM. `cargo vet` also publishes a `.sha256` beside its archive;
        # the pin below is the same value.
        #
        # `aarch64` is handled because a self-hosted or ARM runner is a plausible
        # future, and a step that silently installs an x86_64 binary on an ARM
        # host fails with a confusing `Exec format error` much later.
        timeout-minutes: 5
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64)
              audit_asset="cargo-audit-x86_64-unknown-linux-gnu-v0.23.0.tgz"
              audit_sha="b77993532b253fcbf550996d7716465ec3d734d4e74e7f87bfb65a19add0fb59"
              vet_asset="cargo-vet-x86_64-unknown-linux-gnu.tar.xz"
              vet_sha="e83878b80913fbe43629c28768e14ab51f4e86a4ba8f9dd08cc25b8dbc503c19"
              ;;
            aarch64|arm64)
              audit_asset="cargo-audit-aarch64-unknown-linux-gnu-v0.23.0.tgz"
              # Filled in when an ARM runner is first used; the step fails loudly
              # rather than installing an unverified binary.
              audit_sha=""
              echo "::error::no pinned digest for cargo-audit on aarch64 yet"
              exit 1
              ;;
            *)
              echo "::error::unsupported architecture $(uname -m) for the prebuilt audit tools"
              exit 1
              ;;
          esac

          mkdir -p /tmp/audit-tools
          cd /tmp/audit-tools
          curl -fsSL -o "$audit_asset" \
            "https://github.com/rustsec/rustsec/releases/download/cargo-audit%2Fv0.23.0/${audit_asset}"
          curl -fsSL -o "$vet_asset" \
            "https://github.com/Mozilla/cargo-vet/releases/download/v0.10.3/${vet_asset}"

          actual=$(sha256sum "$audit_asset" | cut -d' ' -f1)
          if [ "$actual" != "$audit_sha" ]; then
            echo "::error::cargo-audit checksum mismatch — refusing to install it"
            echo "expected: $audit_sha"; echo "actual:   $actual"; exit 1
          fi
          actual=$(sha256sum "$vet_asset" | cut -d' ' -f1)
          if [ "$actual" != "$vet_sha" ]; then
            echo "::error::cargo-vet checksum mismatch — refusing to install it"
            echo "expected: $vet_sha"; echo "actual:   $actual"; exit 1
          fi

          tar xzf "$audit_asset"
          tar xJf "$vet_asset"
          sudo install -m 0755 cargo-audit-*/cargo-audit /usr/local/bin/cargo-audit
          sudo install -m 0755 cargo-vet-*/cargo-vet /usr/local/bin/cargo-vet
          cargo-audit --version
          cargo-vet --version

      - name: Install OSV-Scanner
        if: needs.changes.outputs.scope != 'docs'
        # A download with no timeout is a hang that looks like a slow network.
        timeout-minutes: 5
        # Pinned by version, and the downloaded binary is checked against the
        # release's own checksum before it is used. A scanner fetched over the
        # network without a check is a supply-chain hole in the step that exists
        # to find supply-chain holes.
        #
        # Two things measured the hard way:
        #
        #   * the checksum asset is `osv-scanner_SHA256SUMS`, one file for all
        #     platforms. There is no per-binary `.sha256` file.
        #   * the digest is compared explicitly rather than with
        #     `sha256sum --check`. macOS ships a stub `sha256sum (Darwin) 1.0`
        #     that accepts `--check` and exits 0 on a corrupted file, so a gate
        #     written that way passes on a Mac and means nothing.
        run: |
          set -euo pipefail
          VERSION=2.7.1
          base="https://github.com/google/osv-scanner/releases/download/v${VERSION}"
          mkdir -p /tmp/osv
          cd /tmp/osv
          curl -fsSL -o osv-scanner "${base}/osv-scanner_linux_amd64"
          curl -fsSL -o osv-scanner_SHA256SUMS "${base}/osv-scanner_SHA256SUMS"

          expected=$(grep ' osv-scanner_linux_amd64$' osv-scanner_SHA256SUMS | cut -d' ' -f1)
          actual=$(sha256sum osv-scanner | cut -d' ' -f1)
          if [ -z "$expected" ]; then
            echo "::error::no checksum for osv-scanner_linux_amd64 in the sums file"
            exit 1
          fi
          if [ "$expected" != "$actual" ]; then
            echo "::error::osv-scanner checksum mismatch — refusing to install it"
            echo "expected: $expected"; echo "actual:   $actual"; exit 1
          fi

          sudo install -m 0755 osv-scanner /usr/local/bin/osv-scanner
          osv-scanner --version

      - name: Start RustFS
        if: needs.changes.outputs.scope != 'docs'
        # The wait loop below is bounded, but the download above it is not.
        timeout-minutes: 5
        # `ksp-backend:s3_store` needs an S3 server at 127.0.0.1:9000. The VM
        # installs the same release binary; a runner does the same.
        #
        # Two things about this are not obvious, and each cost a failed tag:
        #
        #   * the asset name carries `-latest` in the middle —
        #     `rustfs-linux-x86_64-musl-latest.zip`, not `...-musl.zip`;
        #   * the data directory is `RUSTFS_VOLUMES`, not a positional
        #     argument. Without it the server exits with `VolumeNotFound`.
        run: |
          curl -fsSL -o /tmp/rustfs.zip \
            https://github.com/rustfs/rustfs/releases/latest/download/rustfs-linux-x86_64-musl-latest.zip
          unzip -q /tmp/rustfs.zip -d /tmp/rustfs
          chmod +x /tmp/rustfs/rustfs
          mkdir -p /tmp/rustfs-data
          RUSTFS_ACCESS_KEY=kspadmin \
          RUSTFS_SECRET_KEY=kspadminsecret123 \
          RUSTFS_VOLUMES=/tmp/rustfs-data \
          RUSTFS_ADDRESS=127.0.0.1:9000 \
            /tmp/rustfs/rustfs > /tmp/rustfs.log 2>&1 &
          # A ready S3 server answers an unauthenticated `GET /` with 403, not
          # 200, so `curl -f` reports failure on a healthy server. Probe for any
          # HTTP response instead: a connection refused is the only "not up".
          for i in $(seq 1 60); do
            if curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:9000/ 2>/dev/null | grep -qE '^[1-5][0-9][0-9]$'; then
              echo "rustfs is up"; exit 0
            fi
            sleep 1
          done
          echo "rustfs did not start; log follows"; cat /tmp/rustfs.log; exit 1

      - name: Install the AWS CLI
        if: needs.changes.outputs.scope != 'docs'
        timeout-minutes: 5
        # Ubuntu 24.04 has no `awscli` package (`apt-cache policy awscli` reports
        # no candidate), so the official v2 installer is used. It is a single
        # zip with no runtime dependencies.
        run: |
          curl -fsSL -o /tmp/awscliv2.zip \
            https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip
          unzip -q /tmp/awscliv2.zip -d /tmp
          sudo /tmp/aws/install --update
          aws --version

      - name: Create the S3 test buckets
        if: needs.changes.outputs.scope != 'docs'
        # `s3_store` needs two buckets that already exist, one with versioning
        # on and one with it off. The server does not create them, and a test
        # that made its own bucket would be proving the wrong thing: the
        # admission classifier reads the bucket's configuration, so the
        # configuration has to be real.
        env:
          AWS_ACCESS_KEY_ID: kspadmin
          AWS_SECRET_ACCESS_KEY: kspadminsecret123
          AWS_DEFAULT_REGION: us-east-1
        run: |
          set -euo pipefail
          ep=http://127.0.0.1:9000
          for bucket in ksp-s3-unversioned ksp-s3-versioned; do
            aws --endpoint-url "$ep" s3 mb "s3://$bucket" || true
          done
          aws --endpoint-url "$ep" s3api put-bucket-versioning \
            --bucket ksp-s3-versioned \
            --versioning-configuration Status=Enabled
          echo "--- unversioned (expect no Status) ---"
          aws --endpoint-url "$ep" s3api get-bucket-versioning --bucket ksp-s3-unversioned || echo "(none, correct)"
          echo "--- versioned (expect Enabled) ---"
          aws --endpoint-url "$ep" s3api get-bucket-versioning --bucket ksp-s3-versioned

      - name: Run the gate
        # Build into `./target` so the cache has a path it actually resolves.
        #
        # The gate defaults to `/tmp/ksp-gate-target`, which `rust-cache` cannot
        # express reliably: the target half of `workspaces` is relative to the
        # checkout, so an absolute path became `./tmp/ksp-gate-target` and nothing
        # was ever restored from it.
        #
        # `./target` is the default the action expects, and the gate honours
        # `CARGO_TARGET_DIR`. The runner has the disk for it; the 19 GiB ceiling
        # that forced `/tmp` is a property of the local VM, not of a GitHub runner.
        #
        # `KSP_ROOT_TARGET_DIR` is NOT set here, so the gate uses its default of
        # `/tmp/ksp-gate-root-target` — outside the checkout, and uncached. See
        # the note above the gate's cache steps for why caching it inside the
        # workspace was tried and reverted.
        env:
          CARGO_TARGET_DIR: target
          SCOPE: ${{ needs.changes.outputs.scope }}
        run: bash scripts/ksp-gate.sh ci --scope "$SCOPE" < /dev/null

  plan:
    needs: gate
    # A push to `main` runs the gate to seed the build cache, and nothing else.
    #
    # Without this condition `plan` ran on a `main` push and failed:
    #
    #   × Couldn't parse the version from the provided announcement tag (main)
    #   ╰─▶ unexpected character 'm' while parsing major version number
    #
    # `dist` reads the tag as a version, and `main` is not one. Planning a release
    # is meaningful only for a tag or a pull request, so this job says so rather
    # than relying on the version parser to reject the other case.
    if: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-22.04
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      # These three must require a *tag*, not merely "not a pull request".
      #
      # They were `!github.event.pull_request`, which was correct while the only
      # non-PR trigger was a tag push. Adding `on.push.branches: main` made it
      # wrong: a push to `main` is not a pull request, so `publishing` would be
      # true and the workflow would try to publish a release named after the
      # branch. `startsWith(github.ref, 'refs/tags/')` is the property that
      # actually matters.
      tag: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
      tag-flag: ${{ startsWith(github.ref, 'refs/tags/') && format('--tag={0}', github.ref_name) || '' }}
      publishing: ${{ startsWith(github.ref, 'refs/tags/') }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install dist
        shell: bash
        run: "curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.34.0/cargo-dist-installer.sh | sh"

      - name: Cache dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/dist

      - id: plan
        # `--allow-dirty` is required, not a convenience.
        #
        # `dist` compares the committed workflow against what `dist init` would
        # generate and refuses to plan when they differ:
        #
        #   × .github/workflows/release.yml has out of date contents and needs to
        #     be regenerated ... help: ('allow-dirty' in Cargo.toml to ignore out
        #     of date contents)
        #
        # They differ on purpose. This workflow is hand-edited with the hardening
        # work — pinned action SHAs, path remapping, per-target SBOMs, build
        # provenance attestations, a separate `packages.yml` for `.deb` and
        # `.rpm` — none of which `dist init` emits. Regenerating it would discard
        # every one of those controls, and the release would publish unattested
        # binaries from unpinned actions.
        #
        # The trade-off is real and worth stating: `dist` will not warn again when
        # its own generated portion drifts from the pinned `cargo-dist-version`.
        # The workflow's structure is therefore reviewed by hand, and the version
        # is pinned in `dist-workspace.toml` so a local `dist` warns rather than
        # silently producing something different.
        run: |
          dist ${{ (!github.event.pull_request && format('host --steps=create --tag={0}', github.ref_name)) || 'plan' }} --allow-dirty --output-format=json > plan-dist-manifest.json
          echo "dist ran successfully"
          cat plan-dist-manifest.json
          echo "manifest=$(jq -c "." plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Upload dist-manifest.json
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json

  build-local-artifacts:
    name: build-local-artifacts (${{ join(matrix.targets, ', ') }})
    needs:
      - plan
    if: ${{ needs.plan.result == 'success' && fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null && (needs.plan.outputs.publishing == 'true' || fromJson(needs.plan.outputs.val).ci.github.pr_run_mode == 'upload') }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container && matrix.container.image || null }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
      # RUSTFLAGS is NOT set here. The `env` context is not available in a job's
      # own `env:` block, so `${{ env.HOME }}` made GitHub reject this whole
      # workflow at parse time: every run reported zero jobs and `failure`, with
      # no annotation to read. `github.workspace` is allowed here but `HOME` has
      # no context at all, so the flags are built in a shell step below, where
      # `$HOME` expands, and exported through $GITHUB_ENV.
    permissions:
      # `contents: read` and nothing else.
      #
      # `attestations: write` and `id-token: write` used to sit here, which made
      # the provenance authentic but not unforgeable: any step in this job could
      # request an OIDC token and sign whatever it liked. They now live on the
      # separate `attest` job, which does nothing but sign. A compromised build
      # step can still produce a bad binary; it cannot forge an attestation for
      # one, because this job never holds the token.
      #
      # That is the SLSA Build L3 property. The isolation is between the BUILD
      # job and the ATTEST job, not between the attest job and the reusable
      # workflow it calls - see the note on the `attest` job below.
      "contents": "read"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Rust non-interactively if not already installed
        if: ${{ matrix.container }}
        run: |
          if ! command -v cargo > /dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          fi

      - name: Install dist
        run: ${{ matrix.install_dist.run }}

      - name: Pin SOURCE_DATE_EPOCH and remap build paths
        # Two build-environment values, both measured rather than assumed.
        #
        # SOURCE_DATE_EPOCH: a build script or a dependency that reads the clock
        # produces a different binary on every run. The commit date is the one
        # timestamp that is the same for two builds of the same commit, so it is
        # the only correct value. It must be the *commit* date, not the push
        # date: a push timestamp changes on every push and would make two builds
        # of the same commit differ, which is the opposite of the point.
        #
        # RUSTFLAGS: `trim-paths = "all"` is the RFC 3127 profile setting, and
        # this toolchain (cargo 1.99.1) rejects it: "the package requires the
        # Cargo feature called `trim-paths`, but that feature is not stabilized
        # in this version". So the remap is done with RUSTFLAGS, which is stable.
        #
        # Three roots leak, not one. Remapping only the workspace left 207
        # occurrences of the builder's home in the release binary: the rest were
        # `~/.cargo/registry/...` and `~/.rustup/toolchains/...`. Remapping all
        # three takes it to 0.
        #
        # These are set here rather than in the job's `env:` block because the
        # `env` context is unavailable there, and `$HOME` has no context at all.
        shell: bash
        run: |
          set -euo pipefail
          epoch=$(git log -1 --format=%ct)
          if [ -z "$epoch" ]; then
            echo "::error::could not read the commit date"; exit 1
          fi
          echo "SOURCE_DATE_EPOCH=$epoch" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$epoch ($(date -u -d "@$epoch" 2>/dev/null || date -u -r "$epoch"))"

          flags="--remap-path-prefix=${GITHUB_WORKSPACE}=/build/keyspout"
          flags="$flags --remap-path-prefix=${HOME}/.cargo=/build/cargo"
          flags="$flags --remap-path-prefix=${HOME}/.rustup=/build/rustup"
          echo "RUSTFLAGS=$flags" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=$flags"

      - name: Fetch local artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true

      - name: Install dependencies
        run: |
          ${{ matrix.packages_install }}

      - name: Install cargo-cyclonedx
        # Installed once per job, before the SBOM step, so a matrix that builds
        # several targets does not compile it several times.
        run: cargo install cargo-cyclonedx --locked

      - name: Build artifacts
        run: |
          dist build ${{ needs.plan.outputs.tag-flag }} --allow-dirty --print=linkage --output-format=json ${{ matrix.dist_args }} > dist-manifest.json
          echo "dist ran successfully"

      - name: Generate an SBOM per target
        # One SBOM per target, not one for the workspace: a musl build and a gnu
        # build link different crates, and a single file claiming otherwise would
        # misdescribe every binary it sat beside.
        #
        # `--describe binaries` emits one SBOM per binary target rather than one
        # per crate, and `--target-in-filename` keeps them apart when the matrix
        # runs several targets in one job.
        #
        # The SBOM is generated from `Cargo.lock`, so it lists what was built
        # rather than the version ranges in `Cargo.toml`.
        shell: bash
        run: |
          set -euo pipefail
          for target in ${{ join(matrix.targets, ' ') }}; do
            cargo cyclonedx \
              --manifest-path crates/ksp/Cargo.toml \
              --format json --spec-version 1.5 \
              --describe binaries --target "$target" --target-in-filename
            # `cargo-cyclonedx` writes beside the manifest; move it into the
            # distrib directory so the existing upload step picks it up.
            for f in crates/ksp/*.cdx.json; do
              [ -e "$f" ] || continue
              mv "$f" "target/distrib/ksp-${target}-sbom.cdx.json"
            done
          done
          ls -la target/distrib/*.cdx.json

      - id: cargo-dist
        name: Post-build
        shell: bash
        run: |
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          dist print-upload-files-from-manifest --manifest dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          cp dist-manifest.json "$BUILD_MANIFEST_NAME"

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  # ---------------------------------------------------------------------------
  # HAND-ADDED. The attestation signer, called as a reusable workflow.
  #
  # Two rules, both measured in `bruj0/keyspout-ci-lab` rather than read off the
  # docs. See that repository's RESULTS.md.
  #
  # 1. A reusable workflow is callable only from a JOB, never from a step. A
  #    step-level `uses: ./.github/workflows/attest.yml` is resolved as a local
  #    ACTION, so the runner looks for `action.yml` beside it and every build job
  #    failed with:
  #
  #      Can't find 'action.yml', 'action.yaml' or 'Dockerfile' under
  #      '.../.github/workflows/attest.yml'
  #
  #    `actionlint` does not catch this: it accepts the path as a local action.
  #    v1.0.0 shipped without ever executing this code, so v1.0.1 was the first
  #    release to reach it.
  #
  # 2. The caller must DECLARE every permission the callee declares. This is
  #    stricter than "the callee gets at most what the caller has": a callee that
  #    asks for `id-token: write` under a caller that grants only `contents:
  #    read` fails at PARSE time, before any job runs, as `startup_failure` with
  #    no annotation. So the permissions cannot be delegated to the callee - this
  #    job has to carry them.
  #
  # That is still the Build L3 property, because the isolation is between the
  # BUILD job and this one. The build job keeps `contents: read` and cannot sign;
  # this job signs and builds nothing.
  # ---------------------------------------------------------------------------
  attest:
    name: attest (${{ join(matrix.targets, ', ') }})
    needs:
      - plan
      - build-local-artifacts
    if: ${{ needs.plan.result == 'success' && needs.build-local-artifacts.result == 'success' && fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null && (needs.plan.outputs.publishing == 'true' || fromJson(needs.plan.outputs.val).ci.github.pr_run_mode == 'upload') }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    permissions:
      # Carried here because the callee declares them, and a caller cannot grant
      # less than the callee asks for. Rule 2 above.
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/attest.yml
    with:
      subject-path: "target/distrib/*${{ join(matrix.targets, ', ') }}*"
      subject-name: "${{ join(matrix.targets, ', ') }}"

  build-global-artifacts:
    needs:
      - plan
      - build-local-artifacts
    if: ${{ needs.plan.result == 'success' && fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null && (needs.plan.outputs.publishing == 'true' || fromJson(needs.plan.outputs.val).ci.github.pr_run_mode == 'upload') }}
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install cached dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/

      - run: chmod +x ~/.cargo/bin/dist

      - name: Fetch local artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true

      - id: cargo-dist
        shell: bash
        run: |
          dist build ${{ needs.plan.outputs.tag-flag }} --allow-dirty --output-format=json "--artifacts=global" > dist-manifest.json
          echo "dist ran successfully"
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          dist print-upload-files-from-manifest --manifest dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          cp dist-manifest.json "$BUILD_MANIFEST_NAME"

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-build-global
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  # ---------------------------------------------------------------------------
  # HAND-ADDED. A build matrix proves the compiler produced a file; this job
  # proves the file runs. It sits between the build and the publish so a broken
  # artifact fails the release instead of shipping.
  #
  # The checks are the ones in the plan §5.4. Each runs on the platform it
  # targets, because a macOS binary cannot be executed on Linux.
  # ---------------------------------------------------------------------------
  smoke:
    name: smoke (${{ matrix.name }})
    needs:
      - plan
      - build-local-artifacts
    if: ${{ needs.plan.outputs.publishing == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: linux-aarch64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - name: linux-x86_64-musl
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-musl
          - name: linux-aarch64-musl
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-musl
          - name: macos-aarch64
            runner: macos-15
            target: aarch64-apple-darwin
          - name: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-build-local-*
          path: target/distrib/
          merge-multiple: true

      - name: Extract the archive
        shell: bash
        run: |
          set -euo pipefail
          # The checksum file is excluded explicitly, not by luck of ordering.
          #
          # `*.tar.*` matches both `…tar.xz` and `…tar.xz.sha256`, and `head -1`
          # takes the first match `find` emits — which was the checksum. The step
          # then ran `tar -xf` on a 103-byte text file and failed with
          # "This does not look like a tar archive" on all six platforms.
          #
          # `! -name "*.sha256"` states the intent. Relying on the archive sorting
          # first would work until a target name changed the order.
          archive=$(find target/distrib \
            -name "ksp-*${{ matrix.target }}*.tar.*" \
            ! -name "*.sha256" | head -1)
          if [ -z "$archive" ]; then
            echo "::error::no archive for ${{ matrix.target }}"; exit 1
          fi
          echo "archive: $archive"
          mkdir -p /tmp/ksp-smoke
          tar -xf "$archive" -C /tmp/ksp-smoke
          bin=$(find /tmp/ksp-smoke -name ksp -type f | head -1)
          chmod +x "$bin"
          echo "KSP_BIN=$bin" >> "$GITHUB_ENV"

      - name: The binary executes and reports the tag's version
        shell: bash
        run: |
          set -euo pipefail
          got=$("$KSP_BIN" version)
          want="ksp ${GITHUB_REF_NAME#v}"
          echo "got:  $got"
          echo "want: $want"
          if [ "$got" != "$want" ]; then
            echo "::error::version mismatch: the tag and Cargo.toml disagree"
            exit 1
          fi

      - name: The command surface is intact
        shell: bash
        run: |
          set -euo pipefail
          help=$("$KSP_BIN" --help)
          for cmd in secret token run backend audit; do
            if ! printf '%s' "$help" | grep -q "\b$cmd\b"; then
              echo "::error::the release binary has no '$cmd' command"; exit 1
            fi
          done

      - name: The status disclosure still works
        shell: bash
        run: |
          set -euo pipefail
          KSP_HOME=$(mktemp -d) "$KSP_BIN" status > /dev/null
          echo "status exited 0 on an empty home"

      - name: The static build is static
        if: contains(matrix.target, 'musl')
        shell: bash
        run: |
          set -euo pipefail
          # The property is "no shared-library dependencies", tested directly.
          #
          # This used to grep `ldd` output for one of two phrases, and the musl
          # runner printed a third — `statically linked` — so a correctly static
          # binary failed the check on both musl targets. Enumerating another
          # program's wording is how that happens: `ldd` also exits non-zero for
          # a static binary, so `set -e` and the pipeline both had to be reasoned
          # about at once.
          #
          # A static ELF has no `NEEDED` entries in its dynamic section. Measured
          # both ways in the Linux VM: a `gcc -static` binary reports 0, and
          # `/usr/bin/readelf` reports 6.
          #
          # `readelf` comes from binutils, which a minimal runner image may not
          # carry. It is installed here rather than assumed, because a missing tool
          # would make `grep -c` count zero and the check would pass while testing
          # nothing.
          if ! command -v readelf > /dev/null 2>&1; then
            sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30
            sudo apt-get install -y --no-install-recommends binutils
          fi
          needed=$(readelf -d "$KSP_BIN" 2>/dev/null | grep -c NEEDED || true)
          if [ "$needed" -ne 0 ]; then
            echo "::error::the musl build links $needed shared libraries"
            readelf -d "$KSP_BIN" | grep NEEDED || true
            exit 1
          fi
          echo "no shared-library dependencies: this binary is static"

  host:
    needs:
      - plan
      - build-local-artifacts
      - build-global-artifacts
      - smoke
      - attest
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.publishing == 'true' && (needs.build-global-artifacts.result == 'skipped' || needs.build-global-artifacts.result == 'success') && (needs.build-local-artifacts.result == 'skipped' || needs.build-local-artifacts.result == 'success') && (needs.smoke.result == 'skipped' || needs.smoke.result == 'success') && (needs.attest.result == 'skipped' || needs.attest.result == 'success') }}
    # A human approves the publish. A pushed tag builds, gates and smoke-tests,
    # then stops here until someone approves the `release` environment. That
    # closes the quiet-publish path: a leaked token cannot publish a binary
    # without a person looking at it.
    #
    # The environment must exist in the repository settings with a required
    # reviewer, or this key does nothing. See SECURITY.md.
    environment: release
    # Creating a release and uploading its assets needs `contents: write`.
    #
    # The workflow default is `contents: read`, and this job never overrode it,
    # so the publish failed at the last step with
    #
    #   HTTP 403: Resource not accessible by integration
    #     (https://api.github.com/repos/bruj0/keyspout/releases)
    #
    # Everything before it succeeded: the manifest listed all six artifacts with
    # their checksums and attestations, and only the API call that creates the
    # release was refused.
    #
    # `id-token: write` is not needed here — the attestations were signed in the
    # build jobs, which is where the OIDC token was used.
    permissions:
      "contents": "write"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    runs-on: ubuntu-22.04
    outputs:
      val: ${{ steps.host.outputs.manifest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install cached dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/

      - run: chmod +x ~/.cargo/bin/dist

      - name: Fetch artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true

      - id: host
        shell: bash
        run: |
          dist host ${{ needs.plan.outputs.tag-flag }} --allow-dirty --steps=upload --steps=release --output-format=json > dist-manifest.json
          echo "artifacts uploaded and released successfully"
          cat dist-manifest.json
          echo "manifest=$(jq -c "." dist-manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Upload dist-manifest.json
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-dist-manifest
          path: dist-manifest.json

      - name: Download GitHub Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true

      - name: Cleanup
        run: rm -f artifacts/*-dist-manifest.json

      - name: Create GitHub Release
        env:
          PRERELEASE_FLAG: "${{ fromJson(steps.host.outputs.manifest).announcement_is_prerelease && '--prerelease' || '' }}"
          ANNOUNCEMENT_TITLE: "${{ fromJson(steps.host.outputs.manifest).announcement_title }}"
          ANNOUNCEMENT_BODY: "${{ fromJson(steps.host.outputs.manifest).announcement_github_body }}"
          RELEASE_COMMIT: "${{ github.sha }}"
        run: |
          echo "$ANNOUNCEMENT_BODY" > $RUNNER_TEMP/notes.txt
          gh release create "${{ needs.plan.outputs.tag }}" --target "$RELEASE_COMMIT" $PRERELEASE_FLAG --title "$ANNOUNCEMENT_TITLE" --notes-file "$RUNNER_TEMP/notes.txt" artifacts/*

  publish-homebrew-formula:
    needs:
      - plan
      - host
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PLAN: ${{ needs.plan.outputs.val }}
      GITHUB_USER: "bruj0"
      GITHUB_EMAIL: "ramakandra@gmail.com"
    if: ${{ needs.host.result == 'success' && (!fromJson(needs.plan.outputs.val).announcement_is_prerelease || fromJson(needs.plan.outputs.val).publish_prereleases) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          repository: "bruj0/homebrew-tap"
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Fetch homebrew formulae
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: Formula/
          merge-multiple: true

      - name: Commit formula files
        run: |
          git config --global user.name "${GITHUB_USER}"
          git config --global user.email "${GITHUB_EMAIL}"

          for release in $(echo "$PLAN" | jq --compact-output '.releases[] | select([.artifacts[] | endswith(".rb")] | any)'); do
            filename=$(echo "$release" | jq '.artifacts[] | select(endswith(".rb"))' --raw-output)
            name=$(echo "$filename" | sed "s/\.rb$//")
            version=$(echo "$release" | jq .app_version --raw-output)

            export PATH="/home/linuxbrew/.linuxbrew/bin:$PATH"
            brew update
            brew style --except-cops FormulaAudit/Homepage,FormulaAudit/Desc,FormulaAuditStrict --fix "Formula/${filename}" || true

            git add "Formula/${filename}"
            git commit -m "${name} ${version}"
          done
          git push
