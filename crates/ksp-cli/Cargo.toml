[package]
name = "ksp-cli"
description = "The ksp binary: the command surface, the exit-code contract and the redacting output point."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "ksp"
path = "src/main.rs"

[dependencies]
ksp-types.workspace = true
toml.workspace = true
ksp-record.workspace = true
ksp-backend.workspace = true
ksp-posture.workspace = true
ksp-identity.workspace = true
ksp-deletion.workspace = true
ksp-key-lifecycle.workspace = true

clap.workspace = true
ed25519-dalek.workspace = true
# `libc` is a runtime dependency, not only a test one: the configuration reader
# passes `O_NONBLOCK` to `open(2)` so that a FIFO at the configuration path is
# refused rather than waited on. The other crates open files the same way, with
# `custom_flags` and a raw `libc` constant.
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
zeroize.workspace = true

[dev-dependencies]
libc.workspace = true
serde_json.workspace = true
tempfile.workspace = true
