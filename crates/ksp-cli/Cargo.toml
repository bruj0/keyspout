[package]
name = "ksp-cli"
# The user-facing description, because this is the crate the release tooling
# reads to build the Homebrew formula and the package metadata. The internal
# role of the crate is in the module docs.
description = "A serverless, contract-based secret manager for agents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "ksp"
path = "src/main.rs"

[dependencies]
ksp-types.workspace = true
toml.workspace = true
ksp-record.workspace = true
ksp-backend.workspace = true
ksp-posture.workspace = true
ksp-identity.workspace = true
ksp-deletion.workspace = true
ksp-key-lifecycle.workspace = true

clap.workspace = true
ed25519-dalek.workspace = true
# `libc` is a runtime dependency, not only a test one: the configuration reader
# passes `O_NONBLOCK` to `open(2)` so that a FIFO at the configuration path is
# refused rather than waited on. The other crates open files the same way, with
# `custom_flags` and a raw `libc` constant.
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
zeroize.workspace = true

[dev-dependencies]
libc.workspace = true
serde_json.workspace = true
tempfile.workspace = true

# Native package metadata. Both tools read this section and neither is part of
# the Rust build, so a change here cannot break `cargo build`.
#
# The `.deb` is built from the gnu tarball and the `.rpm` from the musl one; see
# .github/workflows/packages.yml for why.
[package.metadata.deb]
maintainer = "Rodrigo DL <ramakandra@gmail.com>"
copyright = "2026 Rodrigo DL"
license-file = ["../../LICENSE", "0"]
section = "utils"
priority = "optional"
assets = [
    ["target/release/ksp", "usr/bin/ksp", "755"],
]
extended-description = """\
A serverless, contract-based secret manager for agents. Secrets live in a sealed
store you own; an agent gets a short-lived, sealed copy instead of a long-lived
credential. There is no Keyspout service in the trust path."""

[package.metadata.generate-rpm]
# The musl binary is static, so rpm must not invent shared-library Requires from
# it. Without this the package depends on libraries it does not link.
auto-req = "no"
license = "MIT"
summary = "A serverless, contract-based secret manager for agents"
assets = [
    { source = "target/release/ksp", dest = "/usr/bin/ksp", mode = "755" },
]
